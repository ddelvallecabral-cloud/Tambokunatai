# Producción: el sistema publicado en internet con HTTPS automático (Caddy + Let's Encrypt).
#
#   cp .env.example .env        # completá SECRET_KEY, DOMINIO, POSTGRES_PASSWORD, etc. (ver DESPLIEGUE.md)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias con docker-compose.yml (el de prueba):
# - Solo Caddy publica puertos (80 y 443). La base, el backend y el frontend quedan en la red interna.
# - Sin datos de prueba (SEED_DEMO=0) y con cookies seguras.
# - Los respaldos se hacen con deploy/respaldo.sh (ver DESPLIEGUE.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tambo}
      POSTGRES_USER: ${POSTGRES_USER:-tambo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tambo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tambo}
      MEDIA_ROOT: /app/media
      DEBUG: "False"
      SEED_DEMO: "0"
      COOKIE_SECURE: "True"
      ALLOWED_HOSTS: ${DOMINIO:?Falta DOMINIO en el .env},backend,localhost
      CSRF_TRUSTED_ORIGINS: https://${DOMINIO}
      # Caddy escribe X-Forwarded-For con la IP real y Next.js lo pasa tal cual (no agrega nada):
      # Django cuenta un solo proxy. Así la auditoría y el límite de intentos ven la IP del celular.
      NUM_PROXIES: "1"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
